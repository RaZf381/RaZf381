name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yaml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: RaZf381
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Animate snake eating and restore contributions
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              matches = re.findall(
                  r"@keyframes c([0-3])\{([\d.]+)%\{fill:var\(--(c[0-4])\)\}([\d.]+)%,100%\{fill:var\(--ce\)\}\}",
                  svg,
              )
              duration_match = re.search(r"\.s\{[^}]*animation:[^;]*?([\d.]+)ms infinite", svg)
              snake_frames = re.findall(r"@keyframes s[0-3]\{(.*?)\}\.s\.s[0-3]\{", svg, re.DOTALL)
              if len(matches) != 4 or not duration_match or not snake_frames:
                  raise ValueError(f"Could not parse generated SVG animation in {path}")

              reset_match = re.search(r"0%,([\d.]+)%\{transform:", snake_frames[0])
              route_times = [
                  float(t)
                  for frames in snake_frames
                  for t in re.findall(r"([\d.]+)%\{transform:", frames)
              ]
              if not reset_match or not route_times:
                  raise ValueError(f"Could not parse snake route timing in {path}")

              reset = float(reset_match.group(1))
              route_end = max(t for t in route_times if t < reset)
              duration = duration_match.group(1)
              css = [
                  ".c{animation-iteration-count:1!important;animation-fill-mode:forwards!important}",
                  ".u{display:none!important}",
                  f"@keyframes snakeFade{{0%,{route_end}%{{opacity:1}}{reset}%{{opacity:0}}100%{{opacity:0}}}}",
              ]
              for index, eat, color, clear in matches:
                  css.append(
                      f"@keyframes c{index}{{0%,{eat}%{{fill:var(--{color})}}"
                      f"{clear}%,{reset}%{{fill:var(--ce)}}"
                      f"100%{{fill:var(--{color})}}}}"
                  )
                  css.append(f".c.c{index}{{animation:c{index} {duration}ms linear 1 forwards!important}}")

              css.append(f".s{{animation:s0 {duration}ms linear 1 forwards,snakeFade {duration}ms linear 1 forwards!important}}")
              style_end = svg.rfind("</style>")
              if style_end < 0:
                  raise ValueError(f"Could not find SVG styles in {path}")
              path.write_text(svg[:style_end] + "\n" + "\n".join(css) + "\n" + svg[style_end:])
          PY

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
