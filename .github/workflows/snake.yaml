name: Generate contribution snake

on:
  push:
      branches:
            - main
                paths:
                      - ".github/workflows/snake.yaml"
                        schedule:
                            - cron: "0 0 * * *"
                              workflow_dispatch:

                              permissions:
                                contents: write

                                jobs:
                                  generate:
                                      runs-on: ubuntu-latest
                                          steps:
                                                - name: Generate snake animation
                                                        uses: Platane/snk@v3
                                                                with:
                                                                          github_user_name: RaZf381
                                                                                    outputs: |
                                                                                                dist/github-contribution-grid-snake.svg
                                                                                                            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
                                                                                                                    env:
                                                                                                                              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                              
                                                                                                                                    - name: Animate snake eating and restore contributions
                                                                                                                                            run: |
                                                                                                                                                      sudo chown -R "$(id -u):$(id -g)" dist
                                                                                                                                                                python - <<'PY'
                                                                                                                                                                          import re
                                                                                                                                                                                    from pathlib import Path
                                                                                                                                                                                    
                                                                                                                                                                                              contribution_pattern = re.compile(
                                                                                                                                                                                                            r"@keyframes c([0-3])\{0%,([\d.]+)%\{fill:var\(--(c[0-4])\)\}([\d.]+)%,100%\{fill:var\(--ce\)\}\}"
                                                                                                                                                                                                                      )
                                                                                                                                                                                                                                duration_pattern = re.compile(r"\.s\{[^}]*animation:[^;]*?([\d.]+)ms infinite")
                                                                                                                                                                                                                                          snake_frames_pattern = re.compile(r"@keyframes s0\{(.*?)\}\.s\.s0\{", re.DOTALL)
                                                                                                                                                                                                                                                    reset_pattern = re.compile(r"0%,([\d.]+)%\{transform:")
                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                              for path in Path("dist").glob("*.svg"):
                                                                                                                                                                                                                                                                            svg = path.read_text()
                                                                                                                                                                                                                                                                                          matches = contribution_pattern.findall(svg)
                                                                                                                                                                                                                                                                                                        if len(matches) != 4:
                                                                                                                                                                                                                                                                                                                          raise ValueError(f"Expected four contribution keyframes in {path}, found {len(matches)}")
                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                        duration_match = duration_pattern.search(svg)
                                                                                                                                                                                                                                                                                                                                                      snake_frames_match = snake_frames_pattern.search(svg)
                                                                                                                                                                                                                                                                                                                                                                    if not duration_match or not snake_frames_match:
                                                                                                                                                                                                                                                                                                                                                                                      raise ValueError(f"Could not find generated snake timing in {path}")
                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                    snake_frames = snake_frames_match.group(1)
                                                                                                                                                                                                                                                                                                                                                                                                                  reset_match = reset_pattern.search(snake_frames)
                                                                                                                                                                                                                                                                                                                                                                                                                                route_times = [float(value) for value in re.findall(r"([\d.]+)%\{transform:", snake_frames)]
                                                                                                                                                                                                                                                                                                                                                                                                                                              if not reset_match or not route_times:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                raise ValueError(f"Could not determine snake route timing in {path}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              reset_at = float(reset_match.group(1))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            route_end = max(value for value in route_times if value < reset_at)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          css = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ".c{animation-iteration-count:1!important;animation-fill-mode:forwards!important}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ".u{display:none!important}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                f"@keyframes snakeFade{{0%,{route_end}%{{opacity:1}}{reset_at}%{{opacity:0}}100%{{opacity:0}}}}",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for index, eat_at, color, clear_at in matches:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              css.append(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    f"@keyframes c{index}{{0%,{eat_at}%{{fill:var(--{color})}}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          f"{clear_at}%,{reset_at}%{{fill:var(--ce)}}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                f"100%{{fill:var(--{color})}}}}"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    css.append(f".c.c{index}{{animation:c{index} {duration_match.group(1)}ms linear 1 forwards!important}}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  css.append(f".s{{animation:s0 {duration_match.group(1)}ms linear 1 forwards!important;animation-name:s0,snakeFade!important}}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                style_end = svg.rfind("</style>")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if style_end < 0:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                raise ValueError(f"Could not find SVG style block in {path}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              svg = svg[:style_end] + "\n" + "\n".join(css) + "\n" + svg[style_end:]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            path.write_text(svg)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      PY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Publish snake animation
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    uses: crazy-max/ghaction-github-pages@v4.2.0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      target_branch: output
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                build_dir: dist
